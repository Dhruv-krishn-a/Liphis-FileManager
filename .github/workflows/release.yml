name: Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ubuntu:
    name: Build (Ubuntu, Debian, RPM, AppImage)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential cmake ninja-build pkg-config curl \
            qt6-base-dev qt6-declarative-dev \
            libqt6core5compat6-dev libqt6svg6-dev qml6-module-qtquick-shapes \
            libarchive-dev libgit2-dev \
            rpm dpkg-dev patchelf desktop-file-utils file

      - name: Build All Packages
        run: |
          chmod +x scripts/release-packages.sh
          ./scripts/release-packages.sh --clean
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generic-linux-packages
          path: dist/*
          if-no-files-found: error

  build-arch:
    name: Build (Arch Linux PKGBUILD)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Install Arch Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-5compat qt6-svg libgit2 libarchive polkit

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arch Package
        run: |
          # Arch forbids running makepkg as root
          useradd -m builder
          chown -R builder:builder .
          chmod -R 777 .
          
          cd packaging/arch
          # Use the absolute GITHUB_WORKSPACE to test the current checkout instead of the remote URL
          sed -i "s|source=(.*)|source=('liphis::git+file://\${GITHUB_WORKSPACE}')|" PKGBUILD
          # Clean up any existing source clones from previous steps/runs
          rm -rf liphis/ src/ pkg/
          
          su builder -c "makepkg -fc --noconfirm"
          
          mkdir -p ../../dist-arch
          cp *.pkg.tar.zst ../../dist-arch/

      - name: Upload Arch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: dist-arch/*

  create-release:
    name: Create GitHub Release
    needs: [build-ubuntu, build-arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/*.AppImage
            all-artifacts/*.deb
            all-artifacts/*.rpm
            all-artifacts/*.pkg.tar.zst
            all-artifacts/*.tar.gz
            all-artifacts/*.zip
          body: |
            ## Liphis Release ${{ github.ref_name }}
            
            Multi-distro release packages:
            - **Ubuntu/Debian**: .deb
            - **Fedora/SUSE**: .rpm
            - **Arch Linux**: .pkg.tar.zst
            - **Portable**: .AppImage
            - **Generic**: .tar.gz / .zip
